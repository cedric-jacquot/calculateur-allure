<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Calculateur d'Allure de Course à Pied</title>
        <link rel="icon" type="image/png" href="favicon.png"/>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Allure Running</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('pace')">Allure & Vitesse</button>
                <button class="tab-btn" onclick="switchTab('time')">Temps Estimé</button>
            </div>

            <!-- Mode 1: Calculer Allure/Vitesse -->
            <div id="tab-pace" class="tab-content active">
                <div class="preset-btns">
                    <button class="chip" onclick="setPresetDistance('pace', 5)">5 km</button>
                    <button class="chip" onclick="setPresetDistance('pace', 10)">10 km</button>
                    <button class="chip" onclick="setPresetDistance('pace', 21.0975)">Semi</button>
                    <button class="chip" onclick="setPresetDistance('pace', 42.195)">Marathon</button>
                </div>

                <div class="form-group">
                    <label>Distance</label>
                    <div class="input-row">
                        <input type="number" id="pace-dist" step="0.01" placeholder="ex: 10" oninput="calculatePace()" />
                        <span class="unit">km</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Temps chrono (hh : mm : ss)</label>
                    <div class="input-row">
                        <input type="number" id="pace-h" placeholder="hh" min="0" oninput="calculatePace()" />
                        <span>:</span>
                        <input type="number" id="pace-m" placeholder="mm" min="0" max="59" oninput="calculatePace()" />
                        <span>:</span>
                        <input type="number" id="pace-s" placeholder="ss" min="0" max="59" oninput="calculatePace()" />
                    </div>
                </div>

                <div class="result-box">
                    <div class="result-title">Allure requise</div>
                    <div class="result-value" id="pace-res-pace">--:-- min/km</div>
                    <div class="result-subtext" id="pace-res-speed">-- km/h</div>
                </div>
            </div>

            <!-- Mode 2: Calculer Temps -->
            <div id="tab-time" class="tab-content">
                <div class="preset-btns">
                    <button class="chip" onclick="setPresetDistance('time', 5)">5 km</button>
                    <button class="chip" onclick="setPresetDistance('time', 10)">10 km</button>
                    <button class="chip" onclick="setPresetDistance('time', 21.0975)">Semi</button>
                    <button class="chip" onclick="setPresetDistance('time', 42.195)">Marathon</button>
                </div>

                <div class="form-group">
                    <label>Distance</label>
                    <div class="input-row">
                        <input type="number" id="time-dist" step="0.01" placeholder="ex: 10" oninput="calculateTime()" />
                        <span class="unit">km</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Allure cible (mm : ss)</label>
                    <div class="input-row">
                        <input type="number" id="time-pace-m" placeholder="mm" min="0" oninput="calculateTime()" />
                        <span>:</span>
                        <input type="number" id="time-pace-s" placeholder="ss" min="0" max="59" oninput="calculateTime()" />
                        <span class="unit">min/km</span>
                    </div>
                </div>

                <div class="result-box">
                    <div class="result-title">Temps total estimé</div>
                    <div class="result-value" id="time-res-time">--:--:--</div>
                    <div class="result-subtext" id="time-res-speed">-- km/h</div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
